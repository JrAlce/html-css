<!DOCTYPE html>
<html lang="pt-br
">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fórmulário</title>
</head>
<body>
    <h1>Teste de Fórmulário</h1>
    <form action="cadastro.php">
        <p>
            <label for="inome">Nome</label>
            <input type="text" name="nome" id="inome" required maxlength="8" placeholder="Nome completo" autocomplete="name">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
        <p>
            <label for="imedia">Média</label>
            <input type="number" name="media" id="imedia" min="0" max="10" step="0.5" required>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

        <p>
            <label for="imes">Período Letivo</label>
            <input type="month" name="mes" id="imes" value="2020-07">
            <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
            </p>

            <p>
                <label for="idia">Dia da prova</label>
                <input type="date" name="dia" id="idia" value="2020-07-14">
            </p>

            <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">               
            </p>

            <p>
                <label for="ihora">Horário da Prova</label>
                <input type="time" name="hora" id="ihora" value="18:00">
            </p>

            <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">               
            </p>

        </p>
    </form>
</body>
</html>
