<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Relative vs Absolute</title>
  <style>
    body {
      display: flex;
      gap: 40px;
      font-family: sans-serif;
      padding: 40px;
      background: #f0f0f0;
    }

    .container {
      position: relative;
      width: 200px;
      height: 150px;
      background: #ddd;
      border: 2px dashed #aaa;
      padding: 10px;
    }

    .box {
      width: 80px;
      height: 40px;
      background: #3498db;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: move 1s infinite alternate ease-in-out;
    }

    .relative-box {
      position: relative;
    }

    .absolute-box {
      position: absolute;
    }

    @keyframes move {
      to {
        top: 20px;
      }
    }

    h3 {
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div>
    <h3>Relative</h3>
    <div class="container">
      <div class="box relative-box">Box</div>
    </div>
  </div>

  <div>
    <h3>Absolute</h3>
    <div class="container">
      <div class="box absolute-box">Box</div>
    </div>
  </div>
</body>
</html>
