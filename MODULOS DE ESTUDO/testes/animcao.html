<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid span vs número fixo</title>
  <style>
    body {
      display: flex;
      gap: 40px;
      font-family: Arial, sans-serif;
      justify-content: center;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 80px);
      grid-template-rows: repeat(3, 60px);
      gap: 5px;
      background: #eee;
      padding: 5px;
    }

    .caixa {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 16px;
      font-weight: bold;
      color: white;
    }

    .span .c1 { background: crimson; grid-column: 1 / span 2; }
    .fixed .c1 { background: royalblue; grid-column: 1 / 3; }

    .span .c2, .fixed .c2 { background: seagreen; }
    .span .c3, .fixed .c3 { background: orange; }
    .span .c4, .fixed .c4 { background: black; }

    h3 { text-align: center; margin-bottom: 10px; }

    /* animação para mostrar o efeito quando aumentar colunas */
    @keyframes expand {
      0% { grid-template-columns: repeat(4, 80px); }
      50% { grid-template-columns: repeat(6, 80px); }
      100% { grid-template-columns: repeat(4, 80px); }
    }

    .grid {
      animation: expand 6s infinite ease-in-out;
    }
  </style>
</head>
<body>

  <div>
    <h3>Com <code>span</code></h3>
    <div class="grid span">
      <div class="caixa c1">1</div>
      <div class="caixa c2">2</div>
      <div class="caixa c3">3</div>
      <div class="caixa c4">4</div>
    </div>
  </div>

  <div>
    <h3>Com números fixos</h3>
    <div class="grid fixed">
      <div class="caixa c1">1</div>
      <div class="caixa c2">2</div>
      <div class="caixa c3">3</div>
      <div class="caixa c4">4</div>
    </div>
  </div>

</body>
</html>
