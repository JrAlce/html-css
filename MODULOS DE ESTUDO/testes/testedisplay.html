<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display</title>
    <style>
.pai {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 100px);
  gap: 5px;
}

.caixa {
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 20px;
  color: white;
  font-weight: bold;
}

.c1 { background: crimson; grid-column: 1 /  span 2; } /* ocupa 2 colunas */
.c2 { background: seagreen; }
.c3 { background: royalblue; }
.c4 { background: orange; }


    </style>
</head>
<body>
<div class="pai">
  <div class="caixa c1">1</div>
  <div class="caixa c2">2</div>
  <div class="caixa c3">3</div>
  <div class="caixa c4">4</div>
</div>

</body>
</html>
